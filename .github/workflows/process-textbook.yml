name: Process textbook catalog

on:
  workflow_dispatch:
    inputs:
      pdf_choice:
        description: Select one PDF, or auto-process all new PDFs from the latest commit
        required: true
        default: auto
        type: choice
        options:
          - auto
          - 数学二年级上册（2024版）
          - 数学二年级下册（2022版）
          - 语文二年级上册（2024版）
          - 语文二年级下册（2017版）
          - 英语二年级上册（2013版）
          - 英语二年级下册（2013版）
      pdf_path:
        description: Optional repository path for a PDF missing from the dropdown
        required: false
        type: string
      edition_id:
        description: Optional stable ID; leave blank to generate one from the path
        required: false
        type: string
      title:
        description: Optional override; auto-detected from the PDF title page
        required: false
        type: string
      publisher:
        description: Optional override; auto-detected from the PDF when possible
        required: false
        type: string
      edition_label:
        description: Edition label; leave blank to read one from the filename
        required: false
        type: string
      edition_notes:
        description: Optional override; otherwise generated from detected book pages
        required: false
        type: string
      curriculum_standard:
        description: Curriculum standard, if printed in the book
        required: false
        type: string
      approval_year:
        description: Approval year, if stated
        required: false
        type: string
      publication_date:
        description: Publication date, if stated
        required: false
        type: string
      edition_number:
        description: Edition number, if stated
        required: false
        type: string
      printing_date:
        description: Printing date, if stated
        required: false
        type: string
      printing_number:
        description: Printing number, if stated
        required: false
        type: string
      evidence_pdf_pages:
        description: Optional override; otherwise detected from the book pages
        required: false
        type: string
      redistribution_evidence:
        description: Rightsholder permission reference covering every selected PDF
        required: true
        type: string
      confirm_public_redistribution:
        description: Confirm every selected PDF may be redistributed publicly
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: textbook-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install catalog tools
        run: python -m pip install -r tools/requirements.txt

      - name: Configure workflow commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process form and update catalog
        env:
          TEXTBOOK_ACTION_INPUTS: ${{ toJson(inputs) }}
        run: python tools/process_action_input.py

      - name: Validate catalog
        run: python tools/validate_catalog.py check

      - name: Commit and push catalog
        run: |
          git add -- catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git commit -m "Update textbook catalog"
          git push origin HEAD:main
